name: macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main, master, codex/macos-arm64]
    paths:
      - '.github/workflows/macos-arm64.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'docs/MACOS.md'
      - '*.json'
      - '*.ts'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify arm64
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Prepare Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version
      - name: Test and build DMG and app ZIP
        run: bash scripts/build-macos.sh
      - name: Check native startup, Keychain, menu bar and shortcuts
        run: node scripts/smoke-macos.mjs
      - name: Upload Apple Silicon packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TermTranslate-macOS-arm64-${{ github.run_number }}
          path: release/macos-arm64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-arm64-diagnostics-${{ github.run_number }}
          path: |
            .artifacts/native-smoke-macos/native-smoke.json
            release/macos-arm64/build-info.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
