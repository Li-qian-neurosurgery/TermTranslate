[package]
name = "termtranslate"
version = "0.3.1"
description = "A quiet terminal-inspired LLM translator"
authors = ["TermTranslate"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "termtranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
atomicwrites = "0.4"
base64 = "0.22"
sha2 = "0.10"
jsonwebtoken = "9.3"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
